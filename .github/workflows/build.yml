name: Build FILKO JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/filko/jarvis
          mkdir -p app/src/main/res/layout

          [ ! -f AndroidManifest.xml ] || mv AndroidManifest.xml app/src/main/
          [ ! -f MainActivity.kt ] || mv MainActivity.kt app/src/main/java/com/filko/jarvis/
          [ ! -f activity_main.xml ] || mv activity_main.xml app/src/main/res/layout/

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.filko.jarvis"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.filko.jarvis"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
          }
          EOF

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FILKO-JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
